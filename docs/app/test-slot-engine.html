<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Проверка: слот-движок (agnayas)</title>
<style>
  html, body { height:100%; margin:0; background:#2A2D35; }
  #stage-wrap { width:100%; height:100vh; display:flex; align-items:center; justify-content:center; }
  #anim-container { width:min(96vw,900px); height:min(70vh,400px); }
  #anim-container canvas { display: block; width: 100%; height: 100%; }
  #note { position:fixed; top:10px; left:10px; font-family:'Helvetica Neue',sans-serif;
    font-size:12px; color:rgba(230,225,210,.7); background:rgba(0,0,0,.3);
    padding:6px 10px; border-radius:6px; z-index:10; max-width:640px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<div id="note">Слот-движок v2: настоящий оборот (подскок+вращение), отстойник (e уходит в сторону, бледнеет, висит — пока прилетают a и y), финальная волна READY_COLOR. Слоты 1-7 (центрировано в ряду 0-9). Открывать через живой сайт (https://).</div>
<div id="stage-wrap"><div id="anim-container"></div></div>
<script type="module">
import { mountSlotExample, slotX } from './lib/slot-engine.js';

// agnayas: a-g-n-i-[пусто]-a-s, слоты 1-7 (не 0-6 — центрировано по floor((10-7)/2)=1)
const data = {
  initial: [
    { slot: 1, tr: 'a' },
    { slot: 2, tr: 'g' },
    { slot: 3, tr: 'n' },
    { slot: 4, tr: 'i' },
    { slot: 6, tr: 'a' },
    { slot: 7, tr: 's' },
  ],
  ops: [
    // притенение всего, что не участвует прямо сейчас — a,g,n (кроме i/e) и a,s.
    // Начинается сразу после падения, заканчивается до начала финальной волны
    // (волна сама покажет всё в полной яркости момент за моментом).
    { type: 'dim', slots: [1,2,3,6,7], start: 2000, end: 10700, dimOpacity: 0.22, ramp: 700 },

    // гунирование: i → e, на месте (слот 4) — стартует после того, как ВСЕ кубики
    // успели упасть и приземлиться (последний, с учётом stagger, к ~1900мс)
    { type: 'transform', at: 4, toGlyph: 'e', toColor: 0x7DCFCA, start: 2200, spinTurns: 1 },

    // распад: e уходит в отстойник, a и y прилетают как новые кубики
    // (transform заканчивается в 2200+3600=5800, даю запас)
    {
      type: 'split', at: 4, start: 6000,
      riseDur: 1000, holdOpacity: 0.55, holdDur: 2000, fadeDur: 900,
      holdOffset: { x: -1.6, y: 1.6, z: 0.4 },
      arrivals: [
        { into: 'a', newSlot: 4, from: { x: slotX(4) + 1.0, y: 2.5, z: -1.5 }, delay: 400, dur: 1300, arcHeight: 0.9 },
        { into: 'y', newSlot: 5, from: { x: slotX(5) + 1.3, y: 3.0, z: -1.8 }, delay: 0,   dur: 1500, arcHeight: 1.3 },
      ]
    },

    // финал: волна READY_COLOR слева направо по всему слову
    // (split: fadeStart считается из реального прилёта, оканчивается к ~10600 — даю запас)
    { type: 'settle', slots: [1,2,3,4,5,6,7], start: 10900, stepDelay: 150 },
  ]
};

mountSlotExample(document.getElementById('anim-container'), data);
</script>
</body>
</html>
