<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вриддхи в слове · stu- + -ti → stauti</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #363A44; font-family: 'Georgia', serif; color: #e8e4d8; }
  #page { max-width: 900px; margin: 28px auto; padding: 0 16px 40px; }

  #rule-chip {
    background: #F0A24E;
    box-shadow: 0 1px 2px rgba(180,110,30,.28), 0 6px 14px rgba(0,0,0,.18), inset 0 -1px .5px rgba(140,80,10,.22);
    border-radius: 14px; padding: 12px 18px; margin-bottom: 14px;
  }
  #rule-chip .num { font-size: 9px; font-family: 'Helvetica Neue', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: rgba(80,40,5,.6); margin-bottom: 4px; }
  #rule-chip .txt { font-size: 16px; color: #2a1c08; line-height: 1.45; }

  #stage { position: relative; width: 100%; height: 380px; border-radius: 18px; overflow: hidden; background: #363A44; }
  #viewport { position: absolute; inset: 0; }
  #viewport canvas { display: block; width: 100%; height: 100%; }
  #labels-layer { position: absolute; inset: 0; pointer-events: none; }

  .tag-float {
    position: absolute; transform: translate(-50%,-100%);
    font-family: 'Helvetica Neue', sans-serif; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
    color: rgba(240,230,210,.92); background: rgba(20,20,26,.55); border: 1px solid rgba(255,255,255,.14);
    border-radius: 20px; padding: 4px 10px; white-space: nowrap; opacity: 0;
    transition: opacity .25s ease, transform .25s ease;
  }
  .tag-float.show { opacity: 1; transform: translate(-50%,-130%); }

  /* ролевые бейджи: влияющая (nimitta) и поддающаяся (sthānin) */
  .role-badge {
    position: absolute; transform: translate(-50%,-100%);
    font-family: 'Helvetica Neue', sans-serif; white-space: nowrap;
    border-radius: 20px; padding: 3px 10px; opacity: 0; transition: opacity .3s ease;
    font-size: 10px; letter-spacing: .06em;
  }
  .role-badge .rt { text-transform: uppercase; letter-spacing: .1em; }
  .role-badge .dev { font-family: 'Georgia', serif; opacity: .8; margin-left: 4px; }
  .role-badge.show { opacity: 1; }
  .role-badge.trigger { color: #143c38; background: rgba(240,162,78,.9); border: 1px solid rgba(240,162,78,.5); }
  .role-badge.target  { color: #e8e4d8; background: rgba(20,20,26,.55); border: 1px solid rgba(232,228,216,.22); }

  /* волна-пульс дальнодействия (влияющая → поддающаяся) */
  .wave-ring {
    position: absolute; width: 16px; height: 16px; margin-left: -8px; margin-top: -8px;
    border-radius: 50%; border: 2px solid rgba(240,162,78,.9);
    box-shadow: 0 0 10px 1px rgba(240,162,78,.35); pointer-events: none;
    animation: waveTravel var(--wave-dur,.8s) cubic-bezier(.25,.65,.4,1) forwards;
  }
  @keyframes waveTravel {
    0%   { transform: translate(0,0) scale(.35); opacity: 0; }
    12%  { opacity: .95; }
    70%  { opacity: .55; }
    100% { transform: translate(var(--dx,0),var(--dy,0)) scale(1.9); opacity: 0; }
  }

  /* стрелка влияния */
  .influence-arrow {
    position: absolute;
    height: 2px;
    transform-origin: 0 50%;
    background: linear-gradient(90deg, rgba(240,162,78,0) 0%, rgba(240,162,78,0.8) 35%, rgba(240,162,78,0.8) 100%);
    opacity: 0;
    transition: opacity .4s ease;
    pointer-events: none;
  }
  .influence-arrow.show { opacity: 1; }
  .influence-arrow::after {
    content: '';
    position: absolute; right: -1px; top: 50%;
    width: 0; height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 9px solid rgba(240,162,78,0.85);
    transform: translateY(-50%);
  }

  /* импульс контакта */
  .impact-ring {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 2px solid rgba(255,244,220,0.9);
    transform: translate(-50%,-50%);
    animation: ringOut 0.55s ease-out forwards;
    pointer-events: none;
  }
  @keyframes ringOut {
    0%   { width: 8px;  height: 8px;  opacity: 0.95; border-width: 3px; }
    100% { width: 130px; height: 130px; opacity: 0; border-width: 0.5px; }
  }

  #caption { margin-top: 16px; text-align: center; font-size: 20px; min-height: 30px; opacity: 1; transition: opacity .25s ease; }
  #caption .gloss { font-family: 'Helvetica Neue', sans-serif; font-size: 11px; letter-spacing: .06em; color: rgba(230,225,210,.55); display: block; margin-top: 3px; }

  #controls { display: flex; justify-content: center; margin-top: 18px; }
  #replay-btn {
    font-family: 'Helvetica Neue', sans-serif; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    padding: 9px 26px; border-radius: 20px; border: 1px solid rgba(230,225,210,.3);
    background: rgba(230,225,210,.08); color: #e8e4d8; cursor: pointer;
    transition: transform .15s cubic-bezier(.34,1.56,.64,1), background .2s;
  }
  #replay-btn:hover { background: rgba(230,225,210,.16); transform: translateY(-2px); }
  #replay-btn:active { transform: translateY(0) scale(.97); }

  #legend {
    display: flex; justify-content: center; gap: 18px; margin-top: 14px;
    font-family: 'Helvetica Neue', sans-serif; font-size: 9.5px; letter-spacing: .05em; color: rgba(220,224,232,.55);
  }
  #legend span { display: inline-flex; align-items: center; gap: 5px; }
  #legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
</style>

<div id="page">

  <div id="rule-chip">
    <div class="num">Вриддхи в слове · वृद्धि · Эмено, упр. 10 (9–10)</div>
    <div class="txt">stu- «хвалить» + личное окончание -ti → корневой u под вриддхи становится au: stauti «он восхваляет». Окончание -ti — влияющая (nimitta), корневой u — поддающаяся (sthānin).</div>
  </div>

  <div id="stage">
    <div id="viewport"></div>

  <div id="legend">
    <span><i style="background:#C0E898"></i> stu- (основа)</span>
    <span><i style="background:#F0A24E"></i> вриддхи (u → au)</span>
    <span><i style="background:#F0BF88"></i> -ti (окончание)</span>

</div>

<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js" } }

<script type="module">
import * as THREE from 'three';
const P = {
  texDepth:    0.55,
  bevelRound:  0.55,
  gradSharp:   0.30,
  cornerIrreg: 0.40,
  powderAcc:   0.40,
  surfSmooth:  0.35,
};

function hash(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453123;return n-Math.floor(n);}
function smoothNoise(x,y){
  const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  return hash(ix,iy)+(hash(ix+1,iy)-hash(ix,iy))*ux+(hash(ix,iy+1)-hash(ix,iy))*uy+(hash(ix+1,iy+1)-hash(ix+1,iy)-hash(ix,iy+1)+hash(ix,iy))*ux*uy;
}
function fbm(x,y,oct){let v=0,a=0.5,f=1;for(let i=0;i<oct;i++){v+=a*smoothNoise(x*f,y*f);a*=0.5;f*=2.1;}return v;}
function mkRng(seed){
  let s=(seed*6364136+1013904223)|0;
  return ()=>{s=(Math.imul(s,1664525)+1013904223)|0;return((s>>>0)%100000)/100000;};
}

function paintChalkFace(sz, baseHex, faceName, seed, variant) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = sz;
  const ctx = cv.getContext('2d');
  const rand = mkRng(seed);

  const texDepth   = P.texDepth;
  const surfSmooth = P.surfSmooth;
  const powderAcc  = P.powderAcc;
  const gradSharp  = P.gradSharp;

  const BR = ((baseHex>>16)&0xFF)/255;
  const BG = ((baseHex>>8)&0xFF)/255;
  const BB = (baseHex&0xFF)/255;
  const wMix = 0.22;
  const CR = BR + (1-BR)*wMix;
  const CG = BG + (1-BG)*wMix;
  const CB = BB + (1-BB)*wMix;

  const NOISE_SZ = 256;
  const noiseCv = document.createElement('canvas');
  noiseCv.width = noiseCv.height = NOISE_SZ;
  const nctx = noiseCv.getContext('2d');
  const nimg = nctx.createImageData(NOISE_SZ, NOISE_SZ);
  const ndat = nimg.data;
  const poreFreq = 20 + (1-surfSmooth)*16;
  const poreAmp  = 0.018 * texDepth;

  for(let y=0;y<NOISE_SZ;y++){
    for(let x=0;x<NOISE_SZ;x++){
      const u=x/NOISE_SZ, v=y/NOISE_SZ;
      const lo = 0.95 + 0.09*fbm(u*2.4+seed*0.4, v*2.4+seed*0.6, 3)*texDepth - 0.045;
      const mi = 0.97 + 0.04*fbm(u*9+seed*1.1, v*9+seed*1.6, 2)*texDepth - 0.02;
      const pore = smoothNoise(u*poreFreq+seed*3.1, v*poreFreq+seed*2.7);
      const poreDip = pore < 0.30 ? -poreAmp*(1-(pore/0.30)) : 0;
      const gr = 0.97 + 0.03*(rand()-0.5)*2.6*(1-surfSmooth*0.5);
      let bright = Math.max(0.84, Math.min(1.04, lo*mi*gr + poreDip));
      bright = 0.97 + (bright-0.97)*1.05;
      const warmShift = (u - 0.5) * gradSharp * 0.04;
      const r = Math.min(1, CR * bright + warmShift*0.01);
      const g = Math.min(1, CG * bright);
      const b = Math.min(1, CB * bright - warmShift*0.008);
      const i=(y*NOISE_SZ+x)*4;
      ndat[i]  =Math.round(Math.max(0,r)*255);
      ndat[i+1]=Math.round(Math.max(0,g)*255);
      ndat[i+2]=Math.round(Math.max(0,b)*255);
      ndat[i+3]=255;
    }
  }
  nctx.putImageData(nimg, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(noiseCv, 0, 0, NOISE_SZ, NOISE_SZ, 0, 0, sz, sz);

  const nScratch = Math.round(2 + (1-surfSmooth)*2);
  for(let k=0;k<nScratch;k++){
    const yPos = sz*(0.05 + k/(nScratch)*0.92 + (rand()-0.5)*0.025);
    const isLight = rand() > 0.45;
    const alpha = (0.008 + rand()*0.010) * (1 - surfSmooth*0.4);
    const col = isLight ? `rgba(255,255,255,${alpha})` : `rgba(20,15,18,${alpha*0.8})`;
    ctx.save();
    ctx.strokeStyle = col;
    ctx.lineWidth = 0.5 + rand()*0.7;
    ctx.beginPath();
    ctx.moveTo(-2, yPos);
    const cp1x = sz*(0.2+rand()*0.25), cp2x = sz*(0.6+rand()*0.25);
    const waviness = (1-surfSmooth)*6;
    ctx.bezierCurveTo(cp1x, yPos+(rand()-0.5)*waviness, cp2x, yPos+(rand()-0.5)*waviness, sz+2, yPos+(rand()-0.5)*waviness*0.5);
    ctx.stroke();
    ctx.restore();
  }

  const bevelW = sz * (0.06 + powderAcc * 0.10);
  const bevelAlpha = 0.04 + powderAcc * 0.07;
  function paintNoisyBevel(gradFn) {
    const bsz = Math.max(64, Math.round(sz/4));
    const scale = sz/bsz;
    const tmp = document.createElement('canvas');
    tmp.width = tmp.height = bsz;
    const tctx = tmp.getContext('2d');
    const tdat = tctx.createImageData(bsz, bsz);
    const dd = tdat.data;
    for(let y=0;y<bsz;y++){
      for(let x=0;x<bsz;x++){
        const a = gradFn(x*scale,y*scale);
        const i=(y*bsz+x)*4;
        if(a<=0){ dd[i+3]=0; continue; }
        const n = 0.75 + 0.3*smoothNoise(x*scale*0.06+seed*5, y*scale*0.06+seed*4);
        dd[i]=255; dd[i+1]=255; dd[i+2]=255;
        dd[i+3]=Math.round(Math.max(0,Math.min(255, a*255*n)));
      }
    }
    tctx.putImageData(tdat,0,0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(tmp,0,0,bsz,bsz,0,0,sz,sz);
  }
  paintNoisyBevel((x,y)=> y<bevelW ? bevelAlpha*(1-y/bevelW) : 0);
  paintNoisyBevel((x,y)=> y>sz-bevelW ? bevelAlpha*((y-(sz-bevelW))/bevelW) : 0);
  paintNoisyBevel((x,y)=> x<bevelW ? bevelAlpha*(1-x/bevelW) : 0);
  paintNoisyBevel((x,y)=> x>sz-bevelW ? bevelAlpha*((x-(sz-bevelW))/bevelW) : 0);

  const corners = [[0,0],[sz,0],[0,sz],[sz,sz]];
  const cornerR = bevelW * 1.0;
  const cornerAlpha = bevelAlpha * 0.5;
  for(const [cx,cy] of corners){
    const g = ctx.createRadialGradient(cx,cy,0, cx,cy,Math.max(1.5,cornerR));
    g.addColorStop(0, `rgba(255,255,255,${cornerAlpha})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,sz,sz);
  }

  const cornerIrreg = P.cornerIrreg;
  const nChips = Math.round(cornerIrreg * 4);
  for(let k=0;k<nChips;k++){
    const cornerIdx = Math.floor(rand()*4);
    const [ccx, ccy] = corners[cornerIdx];
    const dirX = ccx === 0 ? 1 : -1;
    const dirY = ccy === 0 ? 1 : -1;
    const chipDist = bevelW * (0.2 + rand()*0.7);
    const jitter = bevelW * 0.3;
    const chipX = ccx + dirX*chipDist*(0.4+rand()*0.6) + (rand()-0.5)*jitter;
    const chipY = ccy + dirY*chipDist*(0.4+rand()*0.6) + (rand()-0.5)*jitter;
    const chipR = Math.max(1.5, 1.5 + rand()*4*cornerIrreg);
    const chipAlpha = 0.05 + rand()*0.06*cornerIrreg;
    const g = ctx.createRadialGradient(chipX,chipY,0, chipX,chipY,chipR);
    g.addColorStop(0, `rgba(35,22,28,${chipAlpha})`);
    g.addColorStop(1, 'rgba(35,22,28,0)');
    ctx.fillStyle=g;
    ctx.save();
    ctx.translate(chipX,chipY);
    ctx.rotate(rand()*Math.PI);
    ctx.scale(1, 0.5+rand()*0.5);
    ctx.beginPath();
    ctx.arc(0,0,chipR,0,Math.PI*2);
    ctx.restore();
    ctx.fill();
  }

  for(let z=0;z<2;z++){
    const cx=0.2+rand()*0.6, cy=0.2+rand()*0.6;
    const r=(0.20+rand()*0.12)*sz;
    const warm=rand()>0.5;
    const col=warm?`rgba(235,215,180,0.035)`:`rgba(190,210,235,0.035)`;
    const grd=ctx.createRadialGradient(cx*sz,cy*sz,0,cx*sz,cy*sz,r);
    grd.addColorStop(0,col); grd.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=grd; ctx.fillRect(0,0,sz,sz);
  }

  {
    const lighten=(v)=>v+(1-v)*0.40, deepen=(v)=>v*0.80;
    const cL=[lighten(BR),lighten(BG),lighten(BB)].map(v=>Math.round(Math.max(0,Math.min(1,v))*255));
    const cD=[deepen(BR),deepen(BG),deepen(BB)].map(v=>Math.round(Math.max(0,Math.min(1,v))*255));
    const ang = rand()*Math.PI*2;
    const dx = Math.cos(ang)*sz*0.7, dy = Math.sin(ang)*sz*0.7;
    const cx0=sz/2-dx, cy0=sz/2-dy, cx1=sz/2+dx, cy1=sz/2+dy;
    const dgrad = ctx.createLinearGradient(cx0,cy0,cx1,cy1);
    dgrad.addColorStop(0, `rgba(${cL[0]},${cL[1]},${cL[2]},0.16)`);
    dgrad.addColorStop(1, `rgba(${cD[0]},${cD[1]},${cD[2]},0.16)`);
    ctx.fillStyle = dgrad;
    ctx.fillRect(0,0,sz,sz);
  }

  return cv;
}

function makeGrainGrayscale(cv) {
  const sz = cv.width;
  const out = document.createElement('canvas');
  out.width = out.height = sz;
  const octx = out.getContext('2d');
  octx.filter = 'grayscale(1) contrast(1.05)';
  octx.drawImage(cv, 0, 0);
  return out;
}

function paintGlyph(cv, ch) {
  const sz = cv.width;
  const ctx = cv.getContext('2d');
  ctx.save();
  ctx.fillStyle = '#000000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // подгоняем кегль так, чтобы глиф (в т.ч. двухбуквенный 'au') вписался по ширине
  let px = Math.round(sz*0.58);
  const maxW = sz*0.72;
  ctx.font = `700 ${px}px 'Helvetica Neue', Arial, sans-serif`;
  const w = ctx.measureText(ch).width;
  if (w > maxW){
    px = Math.round(px * maxW / w);
    ctx.font = `700 ${px}px 'Helvetica Neue', Arial, sans-serif`;
  }
  ctx.fillText(ch, sz/2, sz/2);
  ctx.restore();
}

function buildChalkMaterials(baseColor, seed, glyph) {
  const SZ = 512;
  const faceInfo = [
    {name:'side',   variant:0},
    {name:'side',   variant:1},
    {name:'top',    variant:0},
    {name:'bottom', variant:2},
    {name:'front',  variant:2, isFace:true},
    {name:'front',  variant:3},
  ];
  return faceInfo.map((fi,idx)=>{
    const cv = paintChalkFace(SZ, baseColor, fi.name, seed+idx*179+31, fi.variant);
    // grain (bump/roughness) is derived from the CLEAN chalk surface, before
    // any glyph is stamped on — so the letter reads as flat matte ink, not
    // as a weird bump on the stone.
    const grainCv = makeGrainGrayscale(cv);
    const bumpTex = new THREE.CanvasTexture(grainCv);
    bumpTex.wrapS = bumpTex.wrapT = THREE.RepeatWrapping;
    const roughTex = new THREE.CanvasTexture(grainCv);
    roughTex.wrapS = roughTex.wrapT = THREE.RepeatWrapping;

    if (fi.isFace && glyph) paintGlyph(cv, glyph);

    const tex = new THREE.CanvasTexture(cv);
    tex.encoding = THREE.sRGBEncoding;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

    return new THREE.MeshStandardMaterial({
      map: tex,
      bumpMap: bumpTex,
      bumpScale: 0.0025,
      roughnessMap: roughTex,
      roughness: 0.97,
      metalness: 0.0,
      envMapIntensity: 0,
      fog: false,
    });
  });
}

function makeChalkGeo(W, H, D, seed) {
  const br = P.bevelRound;
  const chamfer = 0.020 + br * 0.040;
  const noiseAmt = 0.002 + P.cornerIrreg * 0.005;

  const geo = new THREE.BoxGeometry(W,H,D, 24,24,24);
  const pos = geo.attributes.position;
  for(let v=0;v<pos.count;v++){
    let x=pos.getX(v), y=pos.getY(v), z=pos.getZ(v);
    const hW=W/2, hH=H/2, hD=D/2;
    const ox=Math.abs(x)-(hW-chamfer), oy=Math.abs(y)-(hH-chamfer), oz=Math.abs(z)-(hD-chamfer);
    if(ox>0 && oy>0 && oz>0){
      const cL=Math.sqrt(ox*ox+oy*oy+oz*oz);
      const ex=cL-chamfer;
      if(ex>0){
        const pull = 0.50 + br*0.18;
        x -= (ox/cL*Math.sign(x))*ex*pull;
        y -= (oy/cL*Math.sign(y))*ex*pull;
        z -= (oz/cL*Math.sign(z))*ex*pull;
      }
    } else if(ox>0 && oy>0){
      const eL=Math.sqrt(ox*ox+oy*oy);
      const ex=eL-chamfer;
      if(ex>0){
        x -= (ox/eL*Math.sign(x))*ex*(0.55+br*0.20);
        y -= (oy/eL*Math.sign(y))*ex*(0.55+br*0.20);
      }
    } else if(ox>0 && oz>0){
      const eL=Math.sqrt(ox*ox+oz*oz);
      const ex=eL-chamfer;
      if(ex>0){
        x -= (ox/eL*Math.sign(x))*ex*(0.55+br*0.20);
        z -= (oz/eL*Math.sign(z))*ex*(0.55+br*0.20);
      }
    } else if(oy>0 && oz>0){
      const eL=Math.sqrt(oy*oy+oz*oz);
      const ex=eL-chamfer;
      if(ex>0){
        y -= (oy/eL*Math.sign(y))*ex*(0.55+br*0.20);
        z -= (oz/eL*Math.sign(z))*ex*(0.55+br*0.20);
      }
    }
    const nv=(fbm(x*14+seed, y*14+seed*1.3, 4)-0.5)*noiseAmt;
    pos.setXYZ(v, x+nv, y+nv*0.35, z+nv);
  }
  pos.needsUpdate=true;
  geo.computeVertexNormals();
  const norm = geo.attributes.normal;
  for(let v=0;v<norm.count;v++){
    const nx=norm.getX(v), ny=norm.getY(v), nz=norm.getZ(v);
    const jx=(fbm(nx*30+seed,ny*30+seed*1.7,2)-0.5)*0.05;
    const jy=(fbm(ny*30+seed*1.3,nz*30+seed*2.1,2)-0.5)*0.05;
    const jz=(fbm(nz*30+seed*1.9,nx*30+seed*0.7,2)-0.5)*0.05;
    const len=Math.hypot(nx+jx,ny+jy,nz+jz)||1;
    norm.setXYZ(v,(nx+jx)/len,(ny+jy)/len,(nz+jz)/len);
  }
  norm.needsUpdate=true;
  return geo;
}

function makeShadowBlobTexture() {
  const S = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(S/2,S/2,0, S/2,S/2,S/2);
  g.addColorStop(0,   'rgba(0,0,0,0.45)');
  g.addColorStop(0.6, 'rgba(0,0,0,0.22)');
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,S,S);
  const tx = new THREE.CanvasTexture(cv);
  tx.encoding = THREE.sRGBEncoding;
  return tx;
}


/* ═══════════════════════════ СЦЕНА: полный сценарий вриддхи — stu- + -ti → stauti ═══════════════════════════ */

function makeGroundTexture(){
  const S = 512;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(S/2, S*0.34, 0, S/2, S*0.34, S*0.62);
  g.addColorStop(0,   'rgba(80,84,98,0.55)');
  g.addColorStop(0.55,'rgba(60,64,78,0.28)');
  g.addColorStop(1,   'rgba(54,58,68,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,S,S);
  const tx = new THREE.CanvasTexture(cv);
  tx.encoding = THREE.sRGBEncoding;
  return tx;
}
const groundMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 8),
  new THREE.MeshBasicMaterial({ map: makeGroundTexture(), transparent:true, depthWrite:false, fog:false })
);
groundMesh.rotation.x = -Math.PI/2;
groundMesh.position.set(0, -1.62, -0.6);
scene.add(groundMesh);

const shadowTex = makeShadowBlobTexture();

/* Направление вращения — по часовой стрелке (проверено и подтверждено на демо
   ассимиляции). Если на экране окажется наоборот — меняется одной строкой. */
const CW = -1;

// цвет колец-пульса на грани влияющей буквы — формат "R,G,B", меняется
// одной строкой (тот же приём, что и в демо ассимиляции: ярче собственного
// тона кубика, здесь — от персикового -ti)
const PULSE_RING_COLOR = '255,213,154';

const CUBE_SIZE = 1.0;
const FLOOR_Y = -1.05;
const REST_Y = FLOOR_Y + CUBE_SIZE/2;
const SLOT = 1.05;
function slotX(i){ return (i - 2) * SLOT; } // центр — слот 2 (u/au)

const COL_STEM   = 0xC0E898; // stu- — нежный травянистый зелёный
const COL_VRDDHI = 0xF0A24E; // вриддхи — оранжевый
const COL_ENDING = 0xF0BF88; // -ti (окончание)

function makeShadowFor(x){
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.62, 20),
    new THREE.MeshBasicMaterial({ map: shadowTex, transparent:true, depthWrite:false, fog:false })
  );
  shadow.rotation.x = -Math.PI/2;
  shadow.position.set(x+0.08, FLOOR_Y + 0.01, 0.05);
  scene.add(shadow);
  return shadow;
}

function makeCube(color, seed, glyph){
  const geo = makeChalkGeo(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE, seed);
  const mats = buildChalkMaterials(color, seed*97+13, glyph);
  const mesh = new THREE.Mesh(geo, mats);
  scene.add(mesh);
  return { mesh };
}

// два состояния цвета на одной геометрии и одной букве — для -ti, которое
// в конце становится зелёным (слово снова единое)
function makeDualCube(colorA, colorB, glyph, seed){
  const geo = makeChalkGeo(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE, seed);
  const matsA = buildChalkMaterials(colorA, seed*97+13, glyph);
  const matsB = buildChalkMaterials(colorB, seed*97+14, glyph);
  const mesh = new THREE.Mesh(geo, matsA);
  scene.add(mesh);
  return { mesh, matsA, matsB };
}

function faceMat(color, seed, faceName, variant, glyph){
  const SZ = 512;
  const cv = paintChalkFace(SZ, color, faceName, seed, variant);
  const grainCv = makeGrainGrayscale(cv);
  const bumpTex = new THREE.CanvasTexture(grainCv); bumpTex.wrapS=bumpTex.wrapT=THREE.RepeatWrapping;
  const roughTex = new THREE.CanvasTexture(grainCv); roughTex.wrapS=roughTex.wrapT=THREE.RepeatWrapping;
  if (glyph) paintGlyph(cv, glyph);
  const tex = new THREE.CanvasTexture(cv); tex.encoding=THREE.sRGBEncoding; tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  return new THREE.MeshStandardMaterial({ map:tex, bumpMap:bumpTex, bumpScale:0.0025, roughnessMap:roughTex, roughness:0.97, metalness:0, envMapIntensity:0, fog:false });
}

// грань с «пульсом под буквой»: концентрические кольца запекаются в саму
// текстуру, между мелом и буквой — буква остаётся читаемой при любом
// радиусе кольца. Перерисовывается каждый кадр, пока влияющая активна.
function buildPulseFace(color, seed, faceName, variant, glyph){
  const SZ = 512;
  const cv = paintChalkFace(SZ, color, faceName, seed, variant);
  const grainCv = makeGrainGrayscale(cv);
  const bumpTex = new THREE.CanvasTexture(grainCv); bumpTex.wrapS=bumpTex.wrapT=THREE.RepeatWrapping;
  const roughTex = new THREE.CanvasTexture(grainCv); roughTex.wrapS=roughTex.wrapT=THREE.RepeatWrapping;
  const baseCv = document.createElement('canvas');
  baseCv.width = baseCv.height = SZ;
  baseCv.getContext('2d').drawImage(cv, 0, 0); // чистый мел, эталон для перерисовки
  if (glyph) paintGlyph(cv, glyph);
  const tex = new THREE.CanvasTexture(cv); tex.encoding=THREE.sRGBEncoding; tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  const material = new THREE.MeshStandardMaterial({ map:tex, bumpMap:bumpTex, bumpScale:0.0025, roughnessMap:roughTex, roughness:0.97, metalness:0, envMapIntensity:0, fog:false });
  return { material, canvas: cv, baseCanvas: baseCv, texture: tex, glyph };
}

function redrawPulseFace(pf, radiusFrac, alpha){
  const sz = pf.canvas.width;
  const ctx = pf.canvas.getContext('2d');
  ctx.clearRect(0, 0, sz, sz);
  ctx.drawImage(pf.baseCanvas, 0, 0);
  if (radiusFrac !== null){
    const cx = sz/2, cy = sz/2;
    const r = Math.max(1, radiusFrac * (sz/2));
    ctx.save();
    ctx.filter = `blur(${sz*0.024}px)`;
    ctx.strokeStyle = `rgba(${PULSE_RING_COLOR},${alpha})`;
    ctx.lineWidth = sz * 0.05;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  if (pf.glyph) paintGlyph(pf.canvas, pf.glyph);
  pf.texture.needsUpdate = true;
}

// как makeDualCube, но передняя грань первого состояния поддерживает
// пульс-кольцо под буквой (для влияющей -ti)
function makeDualPulseCube(colorA, colorB, glyph, seed){
  const geo = makeChalkGeo(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE, seed);
  const pulseFront = buildPulseFace(colorA, seed*97+20, 'front', 2, glyph);
  const matsA = [
    faceMat(colorA, seed*97+13, 'side', 0, null),
    faceMat(colorA, seed*97+14, 'side', 1, null),
    faceMat(colorA, seed*97+15, 'top', 0, null),
    faceMat(colorA, seed*97+16, 'bottom', 2, null),
    pulseFront.material,
    faceMat(colorA, seed*97+17, 'front', 3, null),
  ];
  const matsB = buildChalkMaterials(colorB, seed*97+18, glyph);
  const mesh = new THREE.Mesh(geo, matsA);
  scene.add(mesh);
  return { mesh, matsA, matsB, pulseFront };
}


// четыре состояния для u/au: зелёное u (основа) → оранжевое u (заряд —
// жёлтый занят под гунирование, здесь его нет вообще, только вриддхи) →
// оранжевое au (вриддхи) → зелёное au (итог)
function makeVrddhiCube(seed){
  const geo = makeChalkGeo(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE, seed);
  const matU        = buildChalkMaterials(COL_STEM,   seed*97+13, 'u');
  const matUorange  = buildChalkMaterials(COL_VRDDHI, seed*97+15, 'u');
  const matBlank    = buildChalkMaterials(COL_VRDDHI, seed*97+18, null); // на время самого оборота — без буквы
  const matAU        = buildChalkMaterials(COL_VRDDHI, seed*97+16, 'au');
  const matAUgreen  = buildChalkMaterials(COL_STEM,   seed*97+17, 'au');
  const mesh = new THREE.Mesh(geo, matU);
  scene.add(mesh);
  return { mesh, matU, matUorange, matBlank, matAU, matAUgreen };
}

// порядок в покое: s - t - (u/au) - t - i
const cubes = {
  s:    { ...makeCube(COL_STEM, 1, 's'), slot:0, word:'stem' },
  t1:   { ...makeCube(COL_STEM, 2, 't'), slot:1, word:'stem' },
  u:    { ...makeVrddhiCube(4),          slot:2, word:'stem' },
  t2:   { ...makeDualPulseCube(COL_ENDING, COL_STEM, 't', 6), slot:3, word:'ending' },
  i:    { ...makeDualCube(COL_ENDING, COL_STEM, 'i', 7), slot:4, word:'ending' },
};
Object.keys(cubes).forEach(k=>{ cubes[k].shadow = makeShadowFor(slotX(cubes[k].slot)); });

const NEAR_OFFSET = 0;    // "1 кубик от соседа" — расстояние по умолчанию между блоками
const TOUCH_SHIFT = SLOT; // вплотную = сдвиг на 1 слот влево от NEAR

const tagOp     = document.createElement('div'); tagOp.className='tag-float'; labelsEl.appendChild(tagOp);
const badgeTrigger = document.createElement('div'); badgeTrigger.className='role-badge trigger';
badgeTrigger.innerHTML = '<span class="rt">влияющая</span><span class="dev">निमित्त</span>';
labelsEl.appendChild(badgeTrigger);
const badgeTarget = document.createElement('div'); badgeTarget.className='role-badge target';
badgeTarget.innerHTML = '<span class="rt">поддаётся</span><span class="dev">स्थानिन्</span>';
labelsEl.appendChild(badgeTarget);
const influenceArrow = document.createElement('div'); influenceArrow.className='influence-arrow';
labelsEl.appendChild(influenceArrow);

/* ── таймлайн (мс от старта воспроизведения) ──
   Падение основы (s,t,u) и окончания (t,i) — окончание сразу на дистанции
   «1 кубик» от u. На этой дистанции — роли, дальнодействие (волны от -ti
   к u), u желтеет по факту долёта волны. Затем -ti делает короткий шаг
   вплотную — контакт, запускающий вриддхирование: двойной оборот по часовой
   стрелке, u→оранжевый, затем u→au. В конце — импульс-волна озеленения
   по всему слову. */
const T = {
  stemStart: 0, stemStagger: 150, stemDur: 700,
  endStart: 1350, endStagger: 150, endDur: 700, // -ti падает сразу на «1 кубик» от u

  rolesStart: 2500,                    // роли: бейджи, стрелка, кольцо-пульс
  influenceStart: 2900, influenceDur: 900, // волны -ti → u
  yellowDelay: 560,                    // u оранжевеет ровно в момент долёта волны

  // вриддхирование — на дистанции (u ещё не тронуто соседом, есть место крутиться)
  spinStart: 4100, spinDur: 1900,      // двойной оборот u (CW), затем u → au
  // двойной оборот u (CW): пусто первую половину с лишним (первый оборот
  // целиком + четверть второго), au появляется когда остаётся 3 грани
  // (270°) до конца — см. ниже

  // только теперь, когда u уже стало au, -ti придвигается вплотную —
  // цельным слово становится именно после преобразования, не раньше
  approach2Start: 6400, approach2Dur: 650,

  settleStart: 7300, settleDur: 700,
  total: 8200,
};

function clamp01(t){ return Math.max(0, Math.min(1, t)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function easeOutBounce(t){
  const n1=7.5625,d1=2.75;
  if(t<1/d1) return n1*t*t;
  if(t<2/d1) return n1*(t-=1.5/d1)*t+0.75;
  if(t<2.5/d1) return n1*(t-=2.25/d1)*t+0.9375;
  return n1*(t-=2.625/d1)*t+0.984375;
}

const captionEl = document.getElementById('caption-text');
function setCaption(html){
  captionEl.style.opacity = 0;
  setTimeout(()=>{ captionEl.innerHTML = html; captionEl.style.opacity = 1; }, 180);
}

let playT0 = null;
let flags = {};
let pulseActive = true;
const PULSE_PERIOD = 1700; // период одного цикла кольца под буквой -ti

function resetScene(){
  flags = {};
  pulseActive = true;
  captionEl.style.opacity = 1; captionEl.innerHTML = '&nbsp;';
  [tagOp, badgeTrigger, badgeTarget, influenceArrow].forEach(el=>el.classList.remove('show'));
  document.querySelectorAll('.impact-ring, .wave-ring').forEach(n=>n.remove());

  for (const key of ['s','t1']){
    const c = cubes[key];
    c.mesh.position.set(slotX(c.slot), 6 + Math.random()*2, 0);
    c.mesh.rotation.set(0,0,0);
  }
  cubes.u.mesh.material = cubes.u.matU;
  cubes.u.mesh.position.set(slotX(2), 6 + Math.random()*2, 0);
  cubes.u.mesh.rotation.set(0,0,0);

  for (const key of ['t2','i']){
    const c = cubes[key];
    c.mesh.material = c.matsA;
    c.mesh.position.set(slotX(c.slot) + NEAR_OFFSET + TOUCH_SHIFT, 6 + Math.random()*2, 0);
    c.mesh.rotation.set(0,0,0);
  }
  redrawPulseFace(cubes.t2.pulseFront, null, 0);
}

function fallY(fromY, toY, elapsed, start, dur){
  const t = clamp01((elapsed-start)/dur);
  if (elapsed < start) return fromY;
  return fromY + (toY-fromY)*easeOutBounce(t);
}

function project(vec3){
  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
  const v = vec3.clone().project(camera);
  return { x: (v.x*0.5+0.5)*w, y: (-v.y*0.5+0.5)*h };
}

function spawnWave(fromV, toV, dur){
  const pA = project(fromV), pB = project(toV);
  const ring = document.createElement('div');
  ring.className = 'wave-ring';
  ring.style.left = pA.x + 'px'; ring.style.top = pA.y + 'px';
  ring.style.setProperty('--dx', (pB.x - pA.x) + 'px');
  ring.style.setProperty('--dy', (pB.y - pA.y) + 'px');
  ring.style.setProperty('--wave-dur', dur + 'ms');
  labelsEl.appendChild(ring);
  setTimeout(()=>ring.remove(), dur + 80);
}

function update(elapsed){
  // ── падение s, t (основа) ──
  ['s','t1'].forEach((key,idx)=>{
    const c = cubes[key];
    const start = T.stemStart + idx*T.stemStagger;
    c.mesh.position.y = fallY(7, REST_Y, elapsed, start, T.stemDur);
  });
  // u падает третьим в основе
  {
    const start = T.stemStart + 2*T.stemStagger;
    cubes.u.mesh.position.y = fallY(7, REST_Y, elapsed, start, T.stemDur);
  }
  if (!flags.stemLanded && elapsed >= T.stemStart + 2*T.stemStagger + T.stemDur){
    flags.stemLanded = true; setCaption('stu-');
  }

  // ── падение t, i (окончание) — сразу на «1 кубик» от u ──
  ['t2','i'].forEach((key,idx)=>{
    const c = cubes[key];
    const start = T.endStart + idx*T.endStagger;
    c.mesh.position.y = fallY(7, REST_Y, elapsed, start, T.endDur);
    if (elapsed < T.approach2Start){
      c.mesh.position.x = slotX(c.slot) + NEAR_OFFSET + TOUCH_SHIFT;
    }
  });
  if (!flags.endLanded && elapsed >= T.endStart + T.endStagger + T.endDur){
    flags.endLanded = true; setCaption('stu- <span style="opacity:.55">+</span> -ti');
  }

  // ── роли, стрелка, кольцо-пульс под буквой влияющей (-ti) ──
  if (elapsed >= T.rolesStart){
    if (!flags.roles){
      flags.roles = true;
      badgeTrigger.classList.add('show');
      badgeTarget.classList.add('show');
      influenceArrow.classList.add('show');
    }
    if (pulseActive){
      const cyclePos = ((elapsed - T.rolesStart) % PULSE_PERIOD) / PULSE_PERIOD;
      const radiusFrac = lerp(0.25, 1.0, cyclePos);
      const envelope = Math.sin(cyclePos * Math.PI);
      redrawPulseFace(cubes.t2.pulseFront, radiusFrac, 0.85 * envelope);
    }
  }

  // ── дальнодействие: волны от -ti (t2) к u; u оранжевеет по факту долёта ──
  if (elapsed >= T.influenceStart && elapsed <= T.influenceStart + T.influenceDur){
    [0, 260].forEach((off,i)=>{
      const kf = 'wave'+i;
      if (!flags[kf] && elapsed >= T.influenceStart+off){
        flags[kf] = true;
        spawnWave(
          cubes.t2.mesh.position.clone().add(new THREE.Vector3(0,0.1,0)),
          cubes.u.mesh.position.clone().add(new THREE.Vector3(0,0.1,0)),
          560
        );
      }
    });
    if (!flags.opTag){ flags.opTag = true; tagOp.textContent = 'вриддхирование'; tagOp.classList.add('show'); }
    const ti = clamp01((elapsed - T.influenceStart)/T.influenceDur);
    cubes.u.mesh.rotation.z = Math.sin(elapsed*0.025) * 0.05 * Math.sin(ti*Math.PI);
  }
  if (!flags.orange && elapsed >= T.influenceStart + T.yellowDelay){
    flags.orange = true;
    cubes.u.mesh.material = cubes.u.matUorange; // зелёное u → оранжевое u (сразу, без жёлтого)
  }
  if (elapsed > T.influenceStart + T.influenceDur && elapsed < T.spinStart){
    cubes.u.mesh.rotation.z = 0;
  }

  // ── вриддхирование: двойной оборот (по часовой), затем u → au.
  // -ti в это время ещё на дистанции («1 кубик») — u есть где крутиться;
  // придвигать соседа раньше преобразования нет смысла: слово станет
  // цельным только после того, как оно реально произойдёт.
  // На время оборота u отъезжает чуть вправо — впритык слева стоит t
  // основы (зазор всего 0.05), а по диагонали куб «выступает» дальше
  // своей плоской грани и на повороте задевал бы соседа. Импульс на -ti
  // держится всю операцию — гаснет только вместе с остановкой оборота,
  // и лишь потом начинается сближение. ──
  if (elapsed >= T.spinStart && elapsed <= T.spinStart + T.spinDur){
    if (!flags.blanked){
      flags.blanked = true;
      cubes.u.mesh.material = cubes.u.matBlank; // на время оборота — без буквы
    }
    const t = clamp01((elapsed - T.spinStart)/T.spinDur);
    const clearance = Math.sin(t*Math.PI) * 0.35; // выезд вправо и обратно, один жест
    cubes.u.mesh.position.x = slotX(2) + clearance;
    cubes.u.mesh.position.y = REST_Y + Math.sin(t*Math.PI)*0.40;
    cubes.u.mesh.rotation.y = CW * easeOutCubic(t) * Math.PI * 4; // два полных оборота, плавно
    // au наносится ровно на середине оборота (t=0.5) — раньше стоявший
    // порог 3 грани (t=0.625) совпадал с моментом, когда грань видна
    // зрителю напрямую, и буква выскакивала «из ниоткуда»
    if (!flags.toVrddhi && t >= 0.5){
      flags.toVrddhi = true;
      cubes.u.mesh.material = cubes.u.matAU; // пусто → оранжевое au
      setCaption('stauti <span class="gloss">«он восхваляет» · вриддхи u → au</span>');
      if (!flags.targetDone){ flags.targetDone = true; badgeTarget.classList.remove('show'); }
    }
  }
  if (elapsed > T.spinStart + T.spinDur && elapsed < T.approach2Start){
    // на последнем кадре оборота t редко попадает ровно в 1 — снимаем
    // накопленную погрешность явно, чтобы куб не «застывал» под углом
    cubes.u.mesh.rotation.y = 0;
    cubes.u.mesh.position.x = slotX(2);
    // оборот завершён — только теперь гасим импульс влияющей и стрелку
    if (!flags.influenceDone){
      flags.influenceDone = true;
      tagOp.classList.remove('show');
      influenceArrow.classList.remove('show');
      pulseActive = false;
      redrawPulseFace(cubes.t2.pulseFront, null, 0);
    }
  }

  // ── только теперь, когда u уже стало au, -ti придвигается вплотную ──
  if (elapsed >= T.approach2Start && elapsed < T.settleStart){
    const t = clamp01((elapsed - T.approach2Start)/T.approach2Dur);
    const te = easeOutCubic(t);
    ['t2','i'].forEach(key=>{
      const c = cubes[key];
      const from = slotX(c.slot) + NEAR_OFFSET + TOUCH_SHIFT;
      const to = slotX(c.slot) + NEAR_OFFSET;
      c.mesh.position.x = lerp(from, to, te);
    });
  }

  // ── итог: волна-импульс озеленения по всему слову, без вращения ──
  const LOCK_WAVE = [
    { cube: cubes.s },  { cube: cubes.t1 }, { cube: cubes.u },
    { cube: cubes.t2 }, { cube: cubes.i },
  ];
  const LOCK_STEP = 80;
  const LOCK_HOP  = 260;
  LOCK_WAVE.forEach(({cube}, idx)=>{
    const start = T.settleStart + idx*LOCK_STEP;
    if (elapsed >= start && elapsed <= start + LOCK_HOP){
      const t = clamp01((elapsed - start)/LOCK_HOP);
      cube.mesh.position.y = REST_Y + Math.sin(t*Math.PI) * 0.14;
      const kf = 'lock' + idx;
      if (!flags[kf] && t >= 0.4){
        flags[kf] = true;
        if (cube === cubes.u) cube.mesh.material = cubes.u.matAUgreen;
        else if (cube.matsB) cube.mesh.material = cube.matsB;
      }
    }
  });
  if (!flags.finalCaption && elapsed >= T.settleStart){
    flags.finalCaption = true;
  }
}

function updateOverlays(){
  const off = new THREE.Vector3(0, CUBE_SIZE*0.5+0.35, 0);
  const pU = project(cubes.u.mesh.position.clone().add(off));
  const pT2 = project(cubes.t2.mesh.position.clone().add(off));
  badgeTarget.style.left = pU.x+'px'; badgeTarget.style.top = pU.y+'px';
  badgeTrigger.style.left = pT2.x+'px'; badgeTrigger.style.top = pT2.y+'px';
  tagOp.style.left = pU.x+'px'; tagOp.style.top = (pU.y-22)+'px';

  const pUc = project(cubes.u.mesh.position);
  const pT2c = project(cubes.t2.mesh.position);
  const dx = pT2c.x - pUc.x, dy = pT2c.y - pUc.y;
  const fullLen = Math.hypot(dx,dy) || 1;
  const inset = 50;
  const len = Math.max(0, fullLen - inset*2);
  const ux = dx/fullLen, uy = dy/fullLen;
  influenceArrow.style.left = (pT2c.x - ux*inset) + 'px';
  influenceArrow.style.top  = (pT2c.y - uy*inset) + 'px';
  influenceArrow.style.width = len + 'px';
  influenceArrow.style.transform = `rotate(${Math.atan2(-dy,-dx)*180/Math.PI}deg)`;
}

function updateShadows(){
  Object.keys(cubes).forEach(key=>{
    const c = cubes[key];
    c.shadow.position.x = c.mesh.position.x + 0.08;
    c.shadow.position.z = c.mesh.position.z + 0.05;
    const heightAbove = Math.max(0, c.mesh.position.y - FLOOR_Y);
    const heightK = Math.max(0.35, 1 - heightAbove*0.14);
    const matOpacity = Array.isArray(c.mesh.material) ? (c.mesh.material[0].opacity ?? 1) : 1;
    c.shadow.scale.setScalar(heightK);
    c.shadow.material.opacity = heightK * matOpacity;
  });
}

function resize(){
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

function frame(now){
  requestAnimationFrame(frame);
  if (playT0 !== null){
    const elapsed = now - playT0;
    update(Math.min(elapsed, T.total + 200));
  }
  camera.position.copy(camBase);
  updateOverlays();
  updateShadows();
  renderer.render(scene, camera);
}

function play(){ resetScene(); playT0 = performance.now(); }
document.getElementById('replay-btn').addEventListener('click', play);

resize();
resetScene();
requestAnimationFrame(frame);
setTimeout(play, 400);
</script>
</body>
